<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GILOK">
<meta name="theme-color" content="#FFFFFF">
<title>GILOK</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html,body{margin:0;height:100%;background:#fff}
  .msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font:14px -apple-system,"Apple SD Gothic Neo",sans-serif;color:#6B6B67;opacity:0;transition:opacity .3s}
  .msg.on{opacity:1}
</style>
</head>
<body>
<div class="msg" id="msg">GILOK 여는 중…</div>
<script>
/*
  GILOK 시작 파일 — 이 파일은 다시 바꿀 필요가 없어요.
  저장소에 있는 gilok-v2.html, gilok-v3.html … 중 가장 높은 번호를 찾아서 열어요.
  업데이트할 때는 새 번호 파일(예: gilok-v3.html)을 "추가"만 하면 돼요.
*/
(async function () {
  setTimeout(function () { document.getElementById('msg').classList.add('on'); }, 600);
  var KEY = 'gilok.version';
  var v = Number(localStorage.getItem(KEY)) || 2;
  function exists(n) {
    return fetch('gilok-v' + n + '.html', { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return r.ok; })
      .catch(function () { return false; });
  }
  // 저장해 둔 번호가 지워졌으면 아래로 내려가며 찾기 (인터넷이 될 때만)
  if (navigator.onLine !== false && v > 2 && !(await exists(v))) {
    while (v > 2 && !(await exists(v))) v--;
  }
  // 더 높은 번호가 새로 올라왔는지 확인
  if (navigator.onLine !== false) {
    while (await exists(v + 1)) v++;
  }
  localStorage.setItem(KEY, String(v));
  location.replace('gilok-v' + v + '.html');
})();
</script>
</body>
</html>
